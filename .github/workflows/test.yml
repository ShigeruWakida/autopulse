name: test

on:
  push:
    branches: [main]
  pull_request:

# Tests only. Nothing here talks to GitHub Projects: GITHUB_TOKEN cannot write to a user
# Project, and AutoPulse deliberately ships no Actions credentials (see README).
permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity for onboard tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v
